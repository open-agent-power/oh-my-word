schema_version: 1
repository: word-skills
skills:
  - name: word-skills
    path: skills/word-skills/SKILL.md
    kind: router
    status: implemented
    modes: [routing, composition]
    dependencies: []
    optional_dependencies: [oh-my-technology, oh-my-patent, oh-my-proposal, oh-my-copyright, word-document]
    evidence: [tests/test_word_skills.py]
  - name: oh-my-technology
    path: skills/oh-my-technology/SKILL.md
    kind: business
    status: implemented
    modes: [technical-report, design-spec, requirements-spec, interface-spec, test-report, user-manual, operations-manual]
    mode_scope:
      technical-report: focused
      design-spec: focused
      requirements-spec: baseline
      interface-spec: baseline
      test-report: baseline
      user-manual: baseline
      operations-manual: baseline
    dependencies: []
    optional_dependencies: [word-document]
    evidence: [tests/test_pipeline.py, tests/test_technology_modes.py]
  - name: oh-my-patent
    path: skills/oh-my-patent/SKILL.md
    kind: business
    status: implemented
    modes: [invention, utility, design, disclosure, application-handoff]
    dependencies: []
    optional_dependencies: []
    evidence: [tests/test_final_gate.py, tests/test_skill_bundle.py]
  - name: word-document
    path: skills/word-document/SKILL.md
    kind: production
    status: implemented
    modes: [docx-layout, template-style, template-slots]
    dependencies: []
    optional_dependencies: []
    evidence: [tests/test_pipeline.py]
  - name: oh-my-proposal
    path: skills/oh-my-proposal/SKILL.md
    kind: business
    status: implemented
    modes: [proposal, feasibility, budget]
    dependencies: [word-document]
    optional_dependencies: []
    evidence: [tests/test_proposal.py]
  - name: oh-my-copyright
    path: skills/oh-my-copyright/SKILL.md
    kind: business
    status: implemented
    modes: [software-copyright, source-material, user-manual]
    dependencies: []
    optional_dependencies: [word-document]
    evidence: [tests/test_copyright.py]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "word-skills"
version = "0.3.0"
description = "Evidence-bound Chinese technical documents, Word delivery, and a compatible patent workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "open-agent-power" }]
keywords = ["patent", "docx", "wps", "office", "agent-skill", "专利"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "python-docx>=1.2.0",
    "PyYAML>=6.0",
    "pdfplumber>=0.11.9",
    "pypdf>=6",
    "defusedxml>=0.7",
    "markdown-it-py>=3,<5",
]

[project.optional-dependencies]
# 只在「读 Office 材料」时用到（`patent.py ingest` 与两个转换脚本）。
# 生成 .docx 的路径一行都不会 import 它们——所以它们是可选而不是必装。
# 装上：pip install -e ".[ingest]"，或 pip install -r requirements-ingest.txt
ingest = [
    "markitdown[docx,pdf]>=0.1.8,<0.2",
    "mammoth>=1.8",       # .docx → HTML（它自己的 Markdown 输出会丢公式与表格）
    "markdownify>=0.13",  # HTML → Markdown，补上 mammoth 缺的表格还原
    "python-pptx>=1.0",   # .pptx 按页抽取
]

templates = [
    "docxtpl>=0.20.2,<0.21",
    "docxcompose>=1.4,<2",
]

dev = ["pytest>=8,<10"]

[project.scripts]
word-skills = "word_skills.cli:main"
oh-my-patent = "oh_my_patent.cli:main"

[project.urls]
Homepage = "https://github.com/open-agent-power/oh-my-word"
Repository = "https://github.com/open-agent-power/oh-my-word.git"

[tool.setuptools.packages.find]
include = ["oh_my_patent*", "word_skills*"]

[tool.setuptools.package-data]
word_skills = ["schemas/*.yaml", "data/*.yaml", "data/proposal-profiles/*.yaml"]
"word_skills._vendor.fokkyp" = ["LICENSE", "UPSTREAM.json", "SKILL.md", "references/*.md"]

[tool.pytest.ini_options]
# Generated deliveries can contain imported projects with their own tests.
testpaths = ["tests", "evals"]
